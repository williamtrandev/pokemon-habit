name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Cancel superseded runs on the same ref (don't burn runner minutes on stale commits).
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic pure-logic units. Both e2e jobs gate on this passing.
  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # E2E on the iOS simulator via Maestro.
  # Release config embeds the JS bundle, so no Metro dev server is needed
  # (a debug build would hang the step waiting on the bundler).
  e2e-ios:
    needs: units
    runs-on: macos-15
    env:
      # Ruby 4 + CocoaPods 1.17 crash on a non-UTF-8 locale (Encoding::CompatibilityError).
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      RUBYOPT: '-Eutf-8'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Boot simulator
        run: |
          DEVICE=$(xcrun simctl list devices available | grep -oE "iPhone [0-9][^(]*\([0-9A-F-]{36}\)" | grep -oE "[0-9A-F-]{36}" | head -1)
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE" || true

      - name: Build & install app (Release, no Metro)
        run: npx expo run:ios --configuration Release --device "$DEVICE"

      - name: Run Maestro flows
        run: maestro test .maestro

      - name: Dump iOS build log on failure
        if: failure()
        run: tail -n 200 .expo/xcodebuild.log || true

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-debug
          path: |
            .expo/xcodebuild.log
            ~/.maestro/tests
          if-no-files-found: ignore

  # E2E on an Android emulator via Maestro.
  # Release variant embeds the JS bundle and (in the Expo template) is signed
  # with the debug keystore, so no signing secrets or Metro server are needed.
  e2e-android:
    needs: units
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci

      - name: Install Maestro
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # Android applicationId has no hyphens: com.anonymous.pokemonhabit.
      - name: Point Maestro flows at the Android package
        run: sed -i 's/com\.anonymous\.pokemon-habit/com.anonymous.pokemonhabit/' .maestro/*.yaml

      - name: Enable KVM (hardware acceleration)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build APK, boot emulator, run Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          script: |
            npx expo run:android --variant release
            maestro test .maestro

      - name: Upload Maestro artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-debug
          path: ~/.maestro/tests
          if-no-files-found: ignore
