name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast, deterministic pure-logic units — the gate on every push/PR.
  units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

  # Whether the E2E service tokens are configured as repo secrets. Gates the e2e
  # job so the workflow stays green on forks / before setup instead of red.
  config:
    runs-on: ubuntu-latest
    outputs:
      e2e_ready: ${{ steps.check.outputs.ready }}
    steps:
      - id: check
        run: echo "ready=${{ secrets.EXPO_TOKEN != '' && secrets.MAESTRO_CLOUD_API_KEY != '' }}" >> "$GITHUB_OUTPUT"

  # E2E the way large RN/Expo projects run it in CI: build is offloaded to
  # EAS Build (cloud), flows run on Maestro Cloud (real devices). No native
  # toolchain, no simulator/emulator, no Metro on the runner.
  #
  # Requires two repo secrets (Settings ▸ Secrets and variables ▸ Actions):
  #   EXPO_TOKEN            — Expo access token (expo.dev ▸ Account ▸ Access tokens)
  #   MAESTRO_CLOUD_API_KEY — Maestro Cloud API key (console.mobile.dev)
  # And once locally: `npx eas-cli@latest init` to link the EAS project.
  e2e:
    needs: [units, config]
    if: needs.config.outputs.e2e_ready == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [ios, android]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # Android applicationId has no hyphens.
      - name: Point Maestro flows at the Android package
        if: matrix.platform == 'android'
        run: sed -i 's/com\.anonymous\.pokemon-habit/com.anonymous.pokemonhabit/' .maestro/*.yaml

      - name: EAS Build (cloud) and download the artifact
        run: |
          eas build --platform ${{ matrix.platform }} --profile e2e --non-interactive --wait
          URL=$(eas build:list --platform ${{ matrix.platform }} --status finished --limit 1 \
                --json --non-interactive \
                | node -e 'const b=JSON.parse(require("fs").readFileSync(0));console.log(b[0].artifacts.applicationArchiveUrl)')
          curl -L -o app-artifact "$URL"
          # iOS simulator builds ship as a tarball of the .app; extract it.
          if [ "${{ matrix.platform }}" = "ios" ]; then
            mkdir app-out && tar -xzf app-artifact -C app-out
            echo "APP_FILE=$(find app-out -maxdepth 2 -name '*.app' | head -1)" >> "$GITHUB_ENV"
          else
            echo "APP_FILE=app-artifact" >> "$GITHUB_ENV"
          fi

      - name: Run flows on Maestro Cloud
        uses: mobile-dev-inc/action-maestro-cloud@v1
        with:
          api-key: ${{ secrets.MAESTRO_CLOUD_API_KEY }}
          app-file: ${{ env.APP_FILE }}
          workspace: .maestro
